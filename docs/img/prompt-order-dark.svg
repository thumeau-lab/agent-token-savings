<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-label="Put what changes at the end of the prompt" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Put what changes at the end of the prompt</title><style>.n{font-variant-numeric:tabular-nums}.x{transform-box:fill-box;transform-origin:0 50%}.y{transform-box:fill-box;transform-origin:50% 100%}.yt{transform-box:fill-box;transform-origin:50% 0}@keyframes o{from{opacity:0}}@keyframes sx{from{transform:scaleX(0)}}@keyframes sy{from{transform:scaleY(0)}}@keyframes sl{from{transform:translateX(96px)}}@keyframes dt{0%{opacity:1;transform:translateX(0)}80%{opacity:1;transform:translateX(538px)}100%{opacity:0;transform:translateX(538px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="959" height="315" rx="12" fill="#0d1117" stroke="#30363d"/><text x="40" y="52" font-size="22" font-weight="600" fill="#e6edf3">Put what changes at the end of the prompt</text><text x="40" y="76" font-size="13" font-weight="400" fill="#9198a1">Same content, different order. Caches match the start of the prompt.</text><text x="40" y="130" font-size="13" font-weight="600" fill="#e6edf3">Before</text><text x="40" y="148" font-size="12" font-weight="400" fill="#9198a1">date at the start</text><rect x="170" y="112" width="90" height="40" rx="8" fill="#db6d28"/><text x="215" y="137" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">date</text><rect x="266" y="112" width="160" height="40" rx="8" fill="#db6d28"/><text x="346" y="137" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">tools</text><rect x="432" y="112" width="160" height="40" rx="8" fill="#db6d28"/><text x="512" y="137" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">instructions</text><rect x="598" y="112" width="196" height="40" rx="8" fill="#db6d28"/><text x="696" y="137" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">conversation</text><rect x="800" y="112" width="120" height="40" rx="8" fill="#db6d28"/><text x="860" y="137" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">new message</text><text x="170" y="176" font-size="13" font-weight="400" fill="#db6d28">The date changes every message, so everything after it is written again.</text><text x="40" y="238" font-size="13" font-weight="600" fill="#e6edf3">After</text><text x="40" y="256" font-size="12" font-weight="400" fill="#9198a1">date at the end</text><g style="animation:o 0.4s ease-out 0.2s both"><g style="animation:sl 0.9s ease-out 0.6s both"><rect x="170" y="220" width="160" height="40" rx="8" fill="#db6d28"/><rect x="170" y="220" width="160" height="40" rx="8" fill="#3fb950" class="x" style="animation:sx 0.3s ease-out 1.55s both"/><text x="250" y="245" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">tools</text></g><g style="animation:sl 0.9s ease-out 0.6s both"><rect x="336" y="220" width="160" height="40" rx="8" fill="#db6d28"/><rect x="336" y="220" width="160" height="40" rx="8" fill="#3fb950" class="x" style="animation:sx 0.3s ease-out 1.75s both"/><text x="416" y="245" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">instructions</text></g><g style="animation:sl 0.9s ease-out 0.6s both"><rect x="502" y="220" width="200" height="40" rx="8" fill="#db6d28"/><rect x="502" y="220" width="200" height="40" rx="8" fill="#3fb950" class="x" style="animation:sx 0.3s ease-out 1.95s both"/><text x="602" y="245" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">conversation</text></g><g opacity="0" style="animation:dt 0.9s ease-out 0.6s both"><rect x="170" y="220" width="90" height="40" rx="8" fill="#db6d28"/><text x="215" y="245" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">date</text></g><g style="animation:o 0.3s ease-out 1.35s both"><rect x="708" y="220" width="210" height="40" rx="8" fill="#db6d28"/><text x="813" y="245" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">date + new message</text></g></g><text x="170" y="284" font-size="13" font-weight="400" fill="#3fb950" style="animation:o 0.4s ease-out 2.25s both">The stable start is re-read from cache. Only the tail is written.</text><text x="920" y="104" font-size="12" font-weight="400" fill="#db6d28" text-anchor="end">written</text><text x="170" y="212" font-size="12" font-weight="400" fill="#3fb950" style="animation:o 0.3s ease-out 1.55s both">read from cache</text><text x="918" y="212" font-size="12" font-weight="400" fill="#db6d28" text-anchor="end" style="animation:o 0.3s ease-out 1.35s both">written</text></svg>