<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="What you re-read is not what you pay for" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>What you re-read is not what you pay for</title><style>.n{font-variant-numeric:tabular-nums}.x{transform-box:fill-box;transform-origin:0 50%}.y{transform-box:fill-box;transform-origin:50% 100%}.yt{transform-box:fill-box;transform-origin:50% 0}@keyframes o{from{opacity:0}}@keyframes sx{from{transform:scaleX(0)}}@keyframes sy{from{transform:scaleY(0)}}@keyframes fl0{from{transform:scaleX(4.57)}}@keyframes fl1{from{transform:translateX(628.7px) scaleX(0.1142)}}@keyframes fl2{from{transform:translateX(74.2px) scaleX(0.0450)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="959" height="379" rx="12" fill="#0d1117" stroke="#30363d"/><text x="40" y="52" font-size="22" font-weight="600" fill="#e6edf3">What you re-read is not what you pay for</text><text x="40" y="76" font-size="13" font-weight="400" fill="#9198a1">One agent, 21 days, 10,619 API calls. Same usage, two units.</text><text x="920" y="52" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">output</text><rect x="865.6" y="43" width="10" height="10" rx="2" fill="#a371f7"/><text x="40" y="124" font-size="13" font-weight="600" fill="#e6edf3">in tokens</text><rect x="40" y="136" width="805" height="40" rx="4" fill="#3fb950"/><rect x="845" y="136" width="71.5" height="40" rx="4" fill="#db6d28"/><rect x="916.5" y="136" width="3.5" height="40" rx="1.5" fill="#a371f7"/><text x="52" y="161" font-size="13" font-weight="600" fill="#0d1117" class="n">cache read 91%</text><text x="857" y="161" font-size="13" font-weight="600" fill="#0d1117" class="n">8.1%</text><text x="40" y="196" font-size="12" font-weight="400" fill="#9198a1" class="n">1.54 G</text><text x="845" y="196" font-size="12" font-weight="400" fill="#9198a1" class="n">137.1 M</text><text x="40" y="236" font-size="13" font-weight="600" fill="#e6edf3">in $ at Opus 5.5 API prices</text><rect x="40" y="248" width="176.3" height="40" rx="4" fill="#3fb950" class="x" style="animation:fl0 0.9s ease-out 0.3s both"/><rect x="216.3" y="248" width="626" height="40" rx="4" fill="#db6d28" class="x" style="animation:fl1 0.9s ease-out 0.3s both"/><rect x="842.3" y="248" width="77.7" height="40" rx="4" fill="#a371f7" class="x" style="animation:fl2 0.9s ease-out 0.3s both"/><g style="animation:o 0.4s ease-out 1.2s both"><text x="52" y="273" font-size="13" font-weight="600" fill="#0d1117" class="n">20%</text><text x="228.3" y="273" font-size="13" font-weight="600" fill="#0d1117" class="n">cache write 71%</text><text x="854.3" y="273" font-size="13" font-weight="600" fill="#0d1117" class="n">8.8%</text><text x="40" y="308" font-size="12" font-weight="400" fill="#9198a1" class="n">$309</text><text x="216.3" y="308" font-size="12" font-weight="400" fill="#9198a1" class="n">$1,097</text><text x="842.3" y="308" font-size="12" font-weight="400" fill="#9198a1" class="n">$136</text></g><text x="40" y="348" font-size="12" font-weight="400" fill="#9198a1">Reads are 91% of tokens, but writes (1h cache, 40x the price of a read) are 71% of the bill.</text></svg>