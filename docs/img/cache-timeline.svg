<svg xmlns="http://www.w3.org/2000/svg" width="960" height="362" viewBox="0 0 960 362" role="img" aria-label="Each turn re-reads the prefix and writes the tail" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Each turn re-reads the prefix and writes the tail</title><style>.n{font-variant-numeric:tabular-nums}.x{transform-box:fill-box;transform-origin:0 50%}.y{transform-box:fill-box;transform-origin:50% 100%}.yt{transform-box:fill-box;transform-origin:50% 0}@keyframes o{from{opacity:0}}@keyframes sx{from{transform:scaleX(0)}}@keyframes sy{from{transform:scaleY(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="959" height="361" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="40" y="52" font-size="22" font-weight="600" fill="#1f2328">Each turn re-reads the prefix and writes the tail</text><text x="40" y="76" font-size="13" font-weight="400" fill="#59636e">Illustration, arbitrary units.</text><text x="40" y="124" font-size="13" font-weight="400" fill="#59636e">turn 1</text><rect x="170" y="108" width="345" height="22" rx="4" fill="#bc4c00" class="x" style="animation:sx 0.4s ease-out 0.1s both"/><text x="182" y="124" font-size="13" font-weight="400" fill="#ffffff" style="animation:o 0.3s ease-out 0.5s both">cold start: everything is written</text><text x="40" y="158" font-size="13" font-weight="400" fill="#59636e">turn 2</text><rect x="170" y="142" width="345" height="22" rx="4" fill="#1a7f37" style="animation:o 0.3s ease-out 0.4s both"/><rect x="515" y="142" width="46" height="22" rx="4" fill="#bc4c00" class="x" style="animation:sx 0.3s ease-out 0.65s both"/><text x="182" y="158" font-size="13" font-weight="400" fill="#ffffff" style="animation:o 0.3s ease-out 0.4s both">read from cache</text><text x="569" y="158" font-size="13" font-weight="400" fill="#bc4c00" style="animation:o 0.3s ease-out 0.95s both">written</text><text x="40" y="192" font-size="13" font-weight="400" fill="#59636e">turn 3</text><rect x="170" y="176" width="391" height="22" rx="4" fill="#1a7f37" style="animation:o 0.3s ease-out 0.7s both"/><rect x="561" y="176" width="69" height="22" rx="4" fill="#bc4c00" class="x" style="animation:sx 0.3s ease-out 0.95s both"/><text x="40" y="226" font-size="13" font-weight="400" fill="#59636e">turn 4</text><rect x="170" y="210" width="460" height="22" rx="4" fill="#1a7f37" style="animation:o 0.3s ease-out 1s both"/><rect x="630" y="210" width="34.5" height="22" rx="4" fill="#bc4c00" class="x" style="animation:sx 0.3s ease-out 1.25s both"/><text x="40" y="260" font-size="13" font-weight="400" fill="#59636e">turn 5</text><rect x="170" y="244" width="494.5" height="22" rx="4" fill="#1a7f37" style="animation:o 0.3s ease-out 1.3s both"/><rect x="664.5" y="244" width="57.5" height="22" rx="4" fill="#bc4c00" class="x" style="animation:sx 0.3s ease-out 1.55s both"/><text x="40" y="294" font-size="13" font-weight="400" fill="#59636e">turn 6</text><rect x="170" y="278" width="552" height="22" rx="4" fill="#1a7f37" style="animation:o 0.3s ease-out 1.6s both"/><rect x="170" y="278" width="552" height="22" rx="4" fill="#bc4c00" class="x" style="animation:sx 0.45s ease-out 1.9s both"/><text x="182" y="294" font-size="13" font-weight="600" fill="#ffffff" style="animation:o 0.3s ease-out 2.35s both">prefix changed: everything is rewritten</text><text x="40" y="328" font-size="13" font-weight="400" fill="#59636e">turn 7</text><rect x="170" y="312" width="552" height="22" rx="4" fill="#1a7f37" style="animation:o 0.3s ease-out 1.9s both"/><rect x="722" y="312" width="46" height="22" rx="4" fill="#bc4c00" class="x" style="animation:sx 0.3s ease-out 2.15s both"/><text x="776" y="328" font-size="13" font-weight="400" fill="#59636e" style="animation:o 0.3s ease-out 2.45s both">cache is back</text></svg>