version: 2

project_name: ats

before:
  hooks:
    - go -C cli mod tidy

builds:
  - id: ats
    main: ./cmd/ats
    dir: cli
    binary: ats
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/thumeau-lab/agent-token-savings/cli/internal/cliapp.Version={{ .Version }}

archives:
  - id: ats
    ids:
      - ats
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Published to thumeau-lab/homebrew-tap. skip_upload: auto skips the push on
# prerelease tags (e.g. v1.0.0-rc1); without HOMEBREW_TAP_GITHUB_TOKEN set,
# the push step itself has nothing to authenticate with and goreleaser skips
# publishing (see docs/providers.md-style policy: never fail a release for a
# missing optional credential).
homebrew_casks:
  - name: ats
    repository:
      owner: thumeau-lab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: auto
    homepage: "https://github.com/thumeau-lab/agent-token-savings"
    description: "Where the prompt cache of an AI coding agent wins or loses money, and which setting to change."

# Published to thumeau-lab/scoop-bucket. Same skip_upload policy as the
# Homebrew cask above.
scoops:
  - name: ats
    repository:
      owner: thumeau-lab
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    skip_upload: auto
    homepage: "https://github.com/thumeau-lab/agent-token-savings"
    description: "Where the prompt cache of an AI coding agent wins or loses money, and which setting to change."

release:
  github:
    owner: thumeau-lab
    name: agent-token-savings
