name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go vet and test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: cli/go.sum
      - name: go vet
        working-directory: cli
        run: go vet ./...
      - name: go test
        working-directory: cli
        run: go test ./...

  python:
    name: pytest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: install pytest
        run: pip install pytest
      - name: run tests
        run: python3 -m pytest -q tests
