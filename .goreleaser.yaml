version: 2

project_name: ats

before:
  hooks:
    - go -C cli mod tidy

builds:
  - id: ats
    main: ./cmd/ats
    dir: cli
    binary: ats
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/thumeau-lab/agent-token-savings/cli/internal/cliapp.Version={{ .Version }}

archives:
  - id: ats
    ids:
      - ats
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: thumeau-lab
    name: agent-token-savings
