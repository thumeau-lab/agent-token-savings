<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-label="RTK: raw versus filtered shell output" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>RTK: raw versus filtered shell output</title><style>.n{font-variant-numeric:tabular-nums}.x{transform-box:fill-box;transform-origin:0 50%}.y{transform-box:fill-box;transform-origin:50% 100%}.yt{transform-box:fill-box;transform-origin:50% 0}@keyframes o{from{opacity:0}}@keyframes sx{from{transform:scaleX(0)}}@keyframes sy{from{transform:scaleY(0)}}@keyframes r0{from{transform:scaleX(1.7536)}}@keyframes r1{from{transform:scaleX(2.5555)}}@keyframes r2{from{transform:scaleX(1.0003)}}@keyframes r3{from{transform:scaleX(2.5316)}}@keyframes r4{from{transform:scaleX(292.3077)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="959" height="403" rx="12" fill="#0d1117" stroke="#30363d"/><text x="40" y="52" font-size="22" font-weight="600" fill="#e6edf3">RTK: raw versus filtered shell output</text><text x="40" y="76" font-size="13" font-weight="400" fill="#9198a1">Bytes sent back to the agent. Scale per row.</text><text x="920" y="52" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">through rtk</text><rect x="833.6" y="43" width="10" height="10" rx="2" fill="#58a6ff"/><text x="817.6" y="52" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">raw</text><rect x="782.4" y="43" width="10" height="10" rx="2" fill="#6e7681"/><text x="40" y="126" font-size="13" font-weight="400" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">git status</text><rect x="376" y="108" width="380" height="12" rx="3" fill="#6e7681"/><rect x="376" y="124" width="216.7" height="12" rx="3" fill="#58a6ff" class="x" style="animation:r0 0.9s ease-out 0.3s both"/><text x="860" y="118" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end" class="n">2.4 k</text><text x="860" y="134" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="end" class="n">1.4 k</text><text x="920" y="126" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end" class="n" style="animation:o 0.3s ease-out 1.2s both">-43%</text><text x="40" y="174" font-size="13" font-weight="400" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">git log -n 30</text><rect x="376" y="156" width="380" height="12" rx="3" fill="#6e7681"/><rect x="376" y="172" width="148.7" height="12" rx="3" fill="#58a6ff" class="x" style="animation:r1 0.9s ease-out 0.3s both"/><text x="860" y="166" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end" class="n">23.6 k</text><text x="860" y="182" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="end" class="n">9.3 k</text><text x="920" y="174" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end" class="n" style="animation:o 0.3s ease-out 1.2s both">-61%</text><text x="40" y="222" font-size="13" font-weight="400" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">git diff HEAD~3 --stat</text><rect x="376" y="204" width="380" height="12" rx="3" fill="#6e7681"/><rect x="376" y="220" width="379.9" height="12" rx="3" fill="#58a6ff" class="x" style="animation:r2 0.9s ease-out 0.3s both"/><text x="860" y="214" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end" class="n">2.5 k</text><text x="860" y="230" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="end" class="n">2.5 k</text><text x="920" y="222" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end" class="n" style="animation:o 0.3s ease-out 1.2s both">0%</text><text x="40" y="270" font-size="13" font-weight="400" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ls -la</text><rect x="376" y="252" width="380" height="12" rx="3" fill="#6e7681"/><rect x="376" y="268" width="150.1" height="12" rx="3" fill="#58a6ff" class="x" style="animation:r3 0.9s ease-out 0.3s both"/><text x="860" y="262" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end" class="n">9.3 k</text><text x="860" y="278" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="end" class="n">3.7 k</text><text x="920" y="270" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end" class="n" style="animation:o 0.3s ease-out 1.2s both">-61%</text><text x="40" y="318" font-size="13" font-weight="400" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">find . -name '*.py' -maxdepth 3</text><rect x="376" y="300" width="380" height="12" rx="3" fill="#6e7681"/><rect x="376" y="316" width="1.3" height="12" rx="0.6" fill="#58a6ff" class="x" style="animation:r4 0.9s ease-out 0.3s both"/><text x="860" y="310" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end" class="n">320.3 k</text><text x="860" y="326" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="end" class="n">1.1 k</text><text x="920" y="318" font-size="13" font-weight="600" fill="#db6d28" text-anchor="end" class="n" style="animation:o 0.3s ease-out 1.2s both">-100%</text><text x="385.3" y="326" font-size="12" font-weight="400" fill="#db6d28" style="animation:o 0.3s ease-out 1.2s both">truncated</text><text x="40" y="372" font-size="12" font-weight="400" fill="#9198a1">Real gain on git log and ls. On find, rtk summarizes and cuts: the agent loses the list.</text></svg>