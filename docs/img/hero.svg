<svg xmlns="http://www.w3.org/2000/svg" width="960" height="212" viewBox="0 0 960 212" role="img" aria-label="agent-token-savings" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>agent-token-savings</title><style>.n{font-variant-numeric:tabular-nums}.x{transform-box:fill-box;transform-origin:0 50%}.y{transform-box:fill-box;transform-origin:50% 100%}.yt{transform-box:fill-box;transform-origin:50% 0}@keyframes o{from{opacity:0}}@keyframes sx{from{transform:scaleX(0)}}@keyframes sy{from{transform:scaleY(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="959" height="211" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="40" y="52" font-size="22" font-weight="600" fill="#1f2328">agent-token-savings</text><text x="40" y="76" font-size="13" font-weight="400" fill="#59636e">Measure, then cut what any coding agent spends. Real numbers, rerunnable scripts.</text><g style="animation:o 0.6s ease-out 0.1s both"><text x="40" y="136" font-size="22" font-weight="600" fill="#bc4c00" class="n">71%</text><text x="40" y="160" font-size="13" font-weight="400" fill="#1f2328">of the bill = cache writes</text><text x="40" y="180" font-size="12" font-weight="400" fill="#59636e">21 days, API prices</text></g><g style="animation:o 0.6s ease-out 0.1s both"><text x="340" y="136" font-size="22" font-weight="600" fill="#0969da" class="n">68%</text><text x="340" y="160" font-size="13" font-weight="400" fill="#1f2328">of the prefix = tool schemas</text><text x="340" y="180" font-size="12" font-weight="400" fill="#59636e">before you type a word</text></g><g style="animation:o 0.6s ease-out 0.1s both"><text x="640" y="136" font-size="22" font-weight="600" fill="#1a7f37" class="n">-61%</text><text x="640" y="160" font-size="13" font-weight="400" fill="#1f2328">git log output through rtk</text><text x="640" y="180" font-size="12" font-weight="400" fill="#59636e">same for ls -la</text></g></svg>